name: CI and Vercel deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  code-quality-check:
    name: CI linting and unit tests

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: 'npm'
        cache-dependency-path: app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd app
        npm ci
        
    - name: Run linting
      run: |
        cd app
        npm run lint
        
    - name: Run tests
      run: |
        cd app
        npm test

  web-quality-check:
    name: Validate browser game

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Check browser game script
      run: node --check app/game.js
    - name: Check static site files
      run: |
        test -f index.html
        test -f app/index.html
        test -f app/style.css
        test -f app/images/background.png
        test -f app/audio/swim.wav
        test -f app/audio/die.wav
        test -f app/audio/score.wav
        test -f app/audio/highscore.wav
        test -f app/images/obstacle.png
        test -f app/images/octo1.png
        test -f app/images/octo2.png
        test -f app/images/octo3.png

  deploy-to-vercel:
    name: Deploy production to Vercel
    needs: [code-quality-check, web-quality-check]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install current Vercel CLI
      run: npm install --global vercel@latest
    - name: Verify Vercel authentication
      run: vercel whoami --token="$VERCEL_TOKEN"
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    - name: Deploy to Vercel
      uses: BetaHuhn/deploy-to-vercel-action@v1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        PRODUCTION: true
        GITHUB_DEPLOYMENT: true
        ATTACH_COMMIT_METADATA: false
