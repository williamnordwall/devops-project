name: project pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  code-quality-check:
    name: CI linting and unit tests

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: 'npm'
        cache-dependency-path: app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd app
        npm ci
        
    - name: Run linting
      run: |
        cd app
        npm run lint
        
    - name: Run tests
      run: |
        cd app
        npm test

  web-quality-check:
    name: Validate browser game

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Check browser game script
      run: node --check app/game.js
    - name: Check static site files
      run: |
        test -f index.html
        test -f app/style.css
        test -f app/images/background.png
        test -f app/audio/swim.wav
        test -f app/audio/die.wav
        test -f app/audio/score.wav
        test -f app/audio/highscore.wav
        test -f app/images/obstacle.png
        test -f app/images/octo1.png
        test -f app/images/octo2.png
        test -f app/images/octo3.png

  terraform-check:
    name: Manage Vercel config
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    env:
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
      TF_VAR_vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Check Terraform formatting
      run: terraform -chdir=infra fmt -check
    - name: Initialize Terraform
      run: terraform -chdir=infra init
    - name: Import existing Vercel env var if needed
      env:
        TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
        TF_VAR_vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
        TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      run: |
        if terraform -chdir=infra state show vercel_project_environment_variable.node_env >/dev/null 2>&1; then
          echo "Terraform state already contains vercel_project_environment_variable.node_env; skipping import."
        else
          terraform -chdir=infra import vercel_project_environment_variable.node_env "${{ secrets.VERCEL_PROJECT_ID }}/NODE_ENV"
        fi
    - name: Validate Terraform
      run: terraform -chdir=infra validate
    - name: Plan Terraform changes
      run: terraform -chdir=infra plan
    - name: Apply Terraform changes
      run: terraform -chdir=infra apply -auto-approve

  deploy-to-vercel:
    name: Deploy production to Vercel
    needs: [code-quality-check, web-quality-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install current Vercel CLI
      run: npm install --global vercel@latest
    - name: Verify Vercel authentication
      run: vercel whoami --token="$VERCEL_TOKEN"
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    - name: Deploy to Vercel
      uses: BetaHuhn/deploy-to-vercel-action@v1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        PRODUCTION: true
        GITHUB_DEPLOYMENT: true
        ATTACH_COMMIT_METADATA: false
